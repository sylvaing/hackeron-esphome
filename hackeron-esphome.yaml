esphome:
  name: hackeron-esp
  friendly_name: ""
  min_version: 2025.5.0
  name_add_mac_suffix: false

  on_boot:
    priority: -100 # Run after all other components are initialized
    then:
      - delay: 30s # Wait 30 seconds after boot to ensure everything is ready
      - logger.log: "Boot completed - starting BLE scanner"
      - lambda: |-
          id(scanner_active) = true;
          id(akeron_found) = false;
      - script.execute: start_scanning

substitutions:
  #replace here your bluetooh mac address
  mac_akeron: "B4:E3:F9:65:71:74"

esp32:
  board: esp32dev
  framework:
    type: esp-idf

#Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

#Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Esp-Akeron Fallback Hotspot"
    password: !secret wifi_password

captive_portal:

#bluetooth_proxy:
#  active: true

globals:
  - id: scanner_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: akeron_found
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: akeron_raw_a10
    type: uint8_t
    restore_value: false
    initial_value: '0'
  - id: raw_m13
    type: uint8_t
    restore_value: false
    initial_value: '0'
  # [corr. 5] Contrôle du CRC des trames reçues (désactivable depuis HA sans reflasher)
  - id: crc_check_enabled
    type: bool
    restore_value: true
    initial_value: 'true'
  - id: crc_errors
    type: uint32_t
    restore_value: false
    initial_value: '0'

# ─────────────────────────────────────────
# SCRIPTS
# ─────────────────────────────────────────
script:
  # Démarre le scan BLE si scanner_active est vrai
  - id: start_scanning
    then:
      - if:
          condition:
            lambda: 'return id(scanner_active);'
          then:
            - logger.log: "Démarrage du scan BLE..."
            - esp32_ble_tracker.start_scan:
                continuous: true

  # Arrête le scan BLE
  - id: stop_scanning
    then:
      - logger.log: "Arrêt du scan BLE..."
      - esp32_ble_tracker.stop_scan:

  # Remet toutes les entités à leur état déconnecté
  - id: reset_entities_state
    then:
      - lambda: |-
          id(akeron_ph).publish_state(NAN);
          id(akeron_water_temp).publish_state(NAN);
          id(akeron_salt).publish_state(NAN);
          id(akeron_alarm).publish_state(NAN);
          id(akeron_warning).publish_state(NAN);
          id(akeron_elx).publish_state(NAN);
          id(akeron_ph_setpoint).publish_state(NAN);
          id(akeron_boost_time).publish_state(NAN);
          id(akeron_elx_alarm).publish_state(NAN);
          id(akeron_alarm_rdx).publish_state(NAN);
          id(akeron_ph_threshold_max).publish_state(NAN);
          id(akeron_ph_threshold_min).publish_state(NAN);
          id(akeron_cover_production).publish_state(NAN);
          id(akeron_boost).publish_state(false);
          id(akeron_elx_pump).publish_state(false);
          id(akeron_flow_switch_active).publish_state(false);
          id(akeron_forced_pump).publish_state(false);
          id(akeron_ph_pump).publish_state(false);
          id(akeron_ph_minus_pump).publish_state(false);
          id(akeron_cfg_flow_switch).publish_state(false);
          id(akeron_cfg_capteur_temp).publish_state(false);
          id(akeron_cfg_capteur_sel).publish_state(false);
          id(akeron_cfg_ph_plus).publish_state(false);
          id(akeron_cfg_ph_minus).publish_state(false);
          id(akeron_cover_active).publish_state(false);
          id(akeron_cover_force).publish_state(false);
          id(akeron_warning_text).publish_state("");
          id(akeron_alarm_text).publish_state("");
          id(akeron_alarm_elx_text).publish_state("");


esp32_ble_tracker:
  scan_parameters:
    duration: 30s
    interval: 1349ms
    window: 449ms
    active: false

  # Décommenter pour déboguer la découverte BLE
  # on_ble_advertise:
  #     then:
  #       - lambda: |-
  #           ESP_LOGD("ble_adv", "Appareil BLE: %s (%s)",
  #             x.get_name().c_str(), x.address_str().c_str());

ble_client:
  - mac_address: ${mac_akeron}
    id: akeron
    on_connect:
      then:
        - lambda: |-
            ESP_LOGD("ble_client", "Connected to AKERON!");
            id(scanner_active) = false;
        - script.execute: stop_scanning

    on_disconnect:
      then:
        - lambda: |-
            ESP_LOGD("ble_client", "Déconnecté de AKERON - reprise du scan");
            id(scanner_active) = true;
            id(akeron_found) = false;
        - script.execute: reset_entities_state
        - script.execute: start_scanning

# ─────────────────────────────────────────
# SWITCHES
# ─────────────────────────────────────────

  # --- Diagnostic ---
switch:
  - platform: template
    name: "BLE Scanner"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: ble_scanner_switch
    entity_category: diagnostic
    lambda: |-
      return id(scanner_active);
    turn_on_action:
      - lambda: |-
          id(scanner_active) = true;
      - script.execute: start_scanning
    turn_off_action:
      - lambda: |-
          id(scanner_active) = false;
      - script.execute: stop_scanning
  # [corr. 5] Si les données disparaissent après le flash, couper ce switch et regarder les logs
  - platform: template
    name: "Contrôle CRC trames"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: crc_check_switch
    entity_category: config
    icon: "mdi:check-decagram"
    lambda: 'return id(crc_check_enabled);'
    turn_on_action:
      - lambda: 'id(crc_check_enabled) = true;'
    turn_off_action:
      - lambda: 'id(crc_check_enabled) = false;'
  - platform: ble_client
    id: ble_client_switch
    ble_client_id: akeron
    name: "Connect to Akeron Device"
    entity_category: diagnostic
  # --- Commande système ---
  - platform: restart
    name: "hackeron restart"

  # --- Configuration matérielle ---
  # Config Flow Switch
  - platform: template
    name: "Config Flow Switch"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cfg_flow_switch
    entity_category: config
    icon: "mdi:water-sync"
    optimistic: true
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Flow Switch ON");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) | 0x10;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]
    turn_off_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Flow Switch OFF");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) & ~0x10;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]

  # Config Capteur Température
  - platform: template
    name: "Config Capteur Temp"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cfg_capteur_temp
    entity_category: config
    icon: "mdi:thermometer-check"
    optimistic: true
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Capteur Temp ON");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) | 0x04;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]
    turn_off_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Capteur Temp OFF");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) & ~0x04;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]

  # Config Pompe PH+
  # [corr. 4] Bits 0-1 de M13 : 01 = pH- seule, 10 = pH+ seule, 11 = les deux (l'appli Corelec
  # n'envoie jamais 00). Couper PH+ alors que pH- est déjà absente est donc refusé.
  # optimistic: false -> l'état affiché est celui relu dans la trame M (3 s après l'écriture).
  - platform: template
    name: "Config Pompe PH+"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cfg_ph_plus
    entity_category: config
    icon: "mdi:arrow-up-circle"
    optimistic: false
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Pompe PH+ ON");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = (id(raw_m13) & 0xFC) | ((id(raw_m13) | 0x02) & 0x03);
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]
    turn_off_action:
      then:
        - if:
            condition:
              lambda: 'return (id(raw_m13) & 0x01) != 0;'
            then:
              - lambda: |-
                  ESP_LOGI("akeron send", "Sending Config Pompe PH+ OFF");
              - ble_client.ble_write:
                  service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                  characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                  value: !lambda |-
                    uint8_t m13 = (id(raw_m13) & 0xFC) | ((id(raw_m13) & ~0x02) & 0x03);
                    std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
                    uint8_t crc = 0;
                    for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
                    result[result.size()-2] = crc;
                    return result;
              - delay: 3s
              - ble_client.ble_write:
                  service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                  characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                  value: [ 42, 82, 63, 77, 10, 42]
            else:
              - lambda: |-
                  ESP_LOGW("akeron send", "Config Pompe PH+ OFF refusé : pH- absente, il faut au moins une pompe pH");
                  id(akeron_cfg_ph_plus).publish_state(true);

  # Config Pompe PH-
  # [corr. 4] Bits 0-1 de M13 : 01 = pH- seule, 10 = pH+ seule, 11 = les deux (l'appli Corelec
  # n'envoie jamais 00). Couper PH- alors que pH+ est déjà absente est donc refusé.
  # optimistic: false -> l'état affiché est celui relu dans la trame M (3 s après l'écriture).
  - platform: template
    name: "Config Pompe PH-"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cfg_ph_minus
    entity_category: config
    icon: "mdi:arrow-down-circle"
    optimistic: false
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Pompe PH- ON");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = (id(raw_m13) & 0xFC) | ((id(raw_m13) | 0x01) & 0x03);
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]
    turn_off_action:
      then:
        - if:
            condition:
              lambda: 'return (id(raw_m13) & 0x02) != 0;'
            then:
              - lambda: |-
                  ESP_LOGI("akeron send", "Sending Config Pompe PH- OFF");
              - ble_client.ble_write:
                  service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                  characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                  value: !lambda |-
                    uint8_t m13 = (id(raw_m13) & 0xFC) | ((id(raw_m13) & ~0x01) & 0x03);
                    std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
                    uint8_t crc = 0;
                    for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
                    result[result.size()-2] = crc;
                    return result;
              - delay: 3s
              - ble_client.ble_write:
                  service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                  characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                  value: [ 42, 82, 63, 77, 10, 42]
            else:
              - lambda: |-
                  ESP_LOGW("akeron send", "Config Pompe PH- OFF refusé : pH+ absente, il faut au moins une pompe pH");
                  id(akeron_cfg_ph_minus).publish_state(true);

  # Config Capteur Sel
  - platform: template
    name: "Config Capteur Sel"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cfg_capteur_sel
    entity_category: config
    icon: "mdi:shaker-outline"
    optimistic: true
    turn_on_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Capteur Sel ON");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) | 0x08;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]
    turn_off_action:
      then:
        - lambda: |-
            ESP_LOGI("akeron send", "Sending Config Capteur Sel OFF");
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint8_t m13 = id(raw_m13) & ~0x08;
              std::vector<unsigned char> result { 42, 77, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, m13, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: [ 42, 82, 63, 77, 10, 42]

  - platform: template
    name: "Cover Force"
    # [corr. 5b] DISABLED : sinon ESPHome exécute turn_off_action au démarrage (défaut ALWAYS_OFF)
    restore_mode: DISABLED
    id: akeron_cover_force
    icon: "mdi:pool"
    optimistic: false
    turn_on_action:
      - ble_client.ble_write:
          service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
          characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
          value: !lambda |-
            uint8_t raw = id(akeron_raw_a10);
            raw = raw | (uint8_t)(1 << 3);
            std::vector<unsigned char> result {
              42, 65, 255, 255, 255, 255, 255, 255, 255, 255,
              raw, 255, 255, 255, 255, 255, 42
            };
            uint8_t crc = 0;
            for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
            result[result.size()-2] = crc;
            return result;
      - delay: 3s
      - ble_client.ble_write:
          service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
          characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
          value: [ 42, 82, 63, 65, 6, 42]
    turn_off_action:
      - ble_client.ble_write:
          service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
          characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
          value: !lambda |-
            uint8_t raw = id(akeron_raw_a10);
            raw = raw & ~(uint8_t)(1 << 3);
            std::vector<unsigned char> result {
              42, 65, 255, 255, 255, 255, 255, 255, 255, 255,
              raw, 255, 255, 255, 255, 255, 42
            };
            uint8_t crc = 0;
            for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
            result[result.size()-2] = crc;
            return result;
      - delay: 3s
      - ble_client.ble_write:
          service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
          characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
          value: [ 42, 82, 63, 65, 6, 42]

# Text sensors for device info
text_sensor:
  - platform: template
    name: "Connection Status"
    id: akeron_connection_status
    entity_category: diagnostic
    lambda: |-
      if (id(akeron).connected()) {
        return {"Connected"};
      } else if (id(akeron_found)) {
        return {"Found - Connecting..."};
      } else if (id(scanner_active)) {
        return {"Scanning..."};
      } else {
        return {"Idle"};
      }
    update_interval: 30s

  - platform: template
    name: "Alarm Text"
    id: akeron_alarm_text
    entity_category: diagnostic

  - platform: template
    name: "Warning Text"
    id: akeron_warning_text
    entity_category: diagnostic

  - platform: template
    name: "Alarm Elx Text"
    id: akeron_alarm_elx_text
    entity_category: diagnostic

  - platform: template
    name: "Model"
    id: akeron_model
    entity_category: diagnostic
    icon: "mdi:pool"

# Automation to start scanning on boot
interval:
  - interval: 60s
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(scanner_active);'
              - lambda: 'return !id(akeron).connected();'
          then:
            - lambda: 'ESP_LOGD("ble_scanner", "Periodic scan check - ensuring scanner is active");'
            - script.execute: start_scanning

  - interval: 30s
    then:
      - if:
          condition:
              - lambda: 'return id(akeron).connected();'
          then:
            - lambda: 'ESP_LOGD("data_request", "BLE Data Request");'
            #trame M 10
            - ble_client.ble_write:
                service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                value: [ 42, 82, 63, 77, 10, 42]

            - delay: 5s
            #trame S 83
            - ble_client.ble_write:
                service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                value: [ 42, 82, 63, 83, 20, 42]

            - delay: 5s
            #trame A 65
            - ble_client.ble_write:
                service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                value: [ 42, 82, 63, 65, 6, 42]

            - delay: 5s
            #trame E 69
            - ble_client.ble_write:
                service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
                characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
                value: !lambda |- 
                  std::vector<unsigned char> result { 42,82,63,69,255,42 };
                  //calcul CRC
                  uint8_t crc = 0;
                  for( int c=0; c < result.size()-2; c++){
                    crc =(uint8_t) (crc ^ result[c]);     // ^ou eclusif bit a bit
                  }
                  result[ result.size()-2 ] = crc;
                  //end CRC
                  return result;

# Boutons d'activation/arrêt du boost électrolyseur
button:
  - platform: template
    name: "Boost Start 2h"
    id: akeron_boost_start
    icon: "mdi:lightning-bolt"
    on_press:
      then:
        - lambda: 'ESP_LOGI("boost", "Sending Boost activation (2h = 120 min)");'
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
            characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
            value: !lambda |-
              uint16_t boost_minutes = 120; // 2h en minutes
              uint8_t msb = (boost_minutes >> 8) & 0xFF;
              uint8_t lsb = boost_minutes & 0xFF;
              // Trame A: [0x2A, 'A', 0xFF, boost_MSB, boost_LSB, 0xFF..., CRC, 0x2A] = 17 octets
              std::vector<unsigned char> result { 42, 65, 255, msb, lsb, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 255, 42 };
              uint8_t crc = 0;
              for (int c = 0; c < (int)result.size()-2; c++) crc ^= result[c];
              result[result.size()-2] = crc;
              return result;
        - delay: 3s
        - ble_client.ble_write:
            service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
