  - platform: template
    name: "PH Threshold Min"
    id: akeron_ph_threshold_min
    icon: "mdi:ph"
    unit_of_measurement: "pH"
    device_class: ph
    state_class: measurement
    accuracy_decimals: 2

  - platform: ble_client
    type: characteristic
    ble_client_id: akeron
    id: akeron_data
    name: "akeron_data"
    # state_class: measurement  (désactivé - trame brute hexadécimale)
    entity_category: diagnostic
    service_uuid: '0bd51666-e7cb-469b-8e4d-2742f1ba77cc'
    characteristic_uuid: 'E7ADD780-B042-4876-AAE1-112855353CC1'
    notify: true
    lambda: |-
      std::string value2(x.begin(), x.end());
      // std::string rawhex = format_hex_pretty((uint8_t *) value2.c_str(), value2.size()).c_str();
      // ESP_LOGD("raw_hex", "%s", rawhex.c_str());
      
      if (x.size() == 16) {
        // [corr. 5] Notification = trame Corelec sans son '*' initial :
        // x[0] = mnémonique, x[1..13] = données, x[14] = CRC, x[15] = '*'.
        // CRC = XOR des octets 0..14 de la trame complète, '*' (0x2A) inclus.
        uint8_t crc = 0x2A;
        for (int c = 0; c < 14; c++) crc ^= x[c];
        if (crc != x[14] || x[15] != 0x2A) {
          id(crc_errors)++;
          ESP_LOGW("akeron_data", "Trame %c rejetée : CRC calculé %02X, reçu %02X, fin %02X (%s)",
                   x[0], crc, x[14], x[15], format_hex_pretty(x).c_str());
          if (id(crc_check_enabled)) return 0;
        }
        // Trame M
        if (x[0] == 77 ) {
          ESP_LOGD("akeron_data", "Akeron Frame M");
          float ph = ( ( x[1] * 256 ) +  x[2] ) / 100.0;
          if ( (ph <= 9.5 ) && ( ph >= 3.5) ) {
            id(akeron_ph).publish_state(ph);
          }

          float water_temp = ( ( x[5] * 256 ) +  x[6] ) / 10.0;
          id(akeron_water_temp).publish_state(water_temp);

          float salt = ( ( x[7] * 256 ) +  x[8] ) / 10.0;
          // [corr. 7] plage absolue de l'appli Corelec : 1-40 g/l (l'ancien filtre <= 10 masquait le réglage >15 g/l)
          if ( (salt <= 40 ) && ( salt >= 0) ) {
            id(akeron_salt).publish_state(salt);
          }

          float redox = ( ( x[3] * 256 ) +  x[4] );
          if ( (redox <= 1000) && (redox >= 350)){
            id(akeron_redox).publish_state(redox);
          }

          int alarm = x[9];
          id(akeron_alarm).publish_state(alarm);

          char alarm_text[256];
          switch (alarm){
            case 0:
              id(akeron_alarm_text).publish_state("No Error");
            break;
            case 10:
              id(akeron_alarm_text).publish_state("E.10 Error Reading PH");
            break;
            case 11:
              id(akeron_alarm_text).publish_state("E.11 PH Stable");
            break;
            case 12:
              // [corr. 2] l'appli affiche l'icône flow switch pour E12
              id(akeron_alarm_text).publish_state("E.12 Pas de débit (flow switch)");
            break;
            case 13:
              id(akeron_alarm_text).publish_state("E.13 PH Low");
            break;
            case 14:
              id(akeron_alarm_text).publish_state("E.14 PH High");
            break;
            case 15:
              id(akeron_alarm_text).publish_state("E.15 PH Inverted Correction");
            break;
            case 18:
              id(akeron_alarm_text).publish_state("E.18 Temperature too Low");
            break;
            case 19:
              id(akeron_alarm_text).publish_state("E.19 Salt is too Low");
            break;
            case 20:
              id(akeron_alarm_text).publish_state("E.20 Redox too High");
            break;
            case 21:
              id(akeron_alarm_text).publish_state("E.21 Redox Low");
            break;
            case 22:
              id(akeron_alarm_text).publish_state("E.22 Redox really Low");
            break;
            default:
              snprintf(alarm_text, sizeof(alarm_text), "Unknown Alarm: %d", alarm);
              id(akeron_alarm_text).publish_state(alarm_text);
            break;
          }

          int warning = x[10] & 0xF;
          id(akeron_warning).publish_state(warning);

          int alarm_rdx = (x[10] >> 4) & 0x0F;
          id(akeron_alarm_rdx).publish_state(alarm_rdx);

          // [corr. 1] Avertissements = champ de bits (appli Corelec, Vues/Mesure.cs) :
          // 2 = sel (E2), 4 = température (E4), 8 = redox (E8), cumulables. Bit 0 : inconnu.
          if (warning == 0) {
            id(akeron_warning_text).publish_state("No Warning");
          } else {
            std::string w;
            if (warning & 0x02) w += "E2 Sel ; ";
            if (warning & 0x04) w += "E4 Température ; ";
            if (warning & 0x08) w += "E8 Redox ; ";
            if (warning & 0x01) w += "bit 0 inconnu ; ";
            w.resize(w.size() - 3);
            id(akeron_warning_text).publish_state(w);
          }

          bool ph_pump = x[11] & 0x80; //
          if (ph_pump) {
            id(akeron_ph_pump).publish_state(true);
          } else {
            id(akeron_ph_pump).publish_state(false);
          }

          bool ph_minus_pump = x[11] & 0x40;
          if (ph_minus_pump) {
            id(akeron_ph_minus_pump).publish_state(true);
          } else {
            id(akeron_ph_minus_pump).publish_state(false);
          }

          bool elx_pump = x[11] & 0x20;
          if (elx_pump) {
            id(akeron_elx_pump).publish_state(true);
          } else {
            id(akeron_elx_pump).publish_state(false);
          }

          bool pump_forced = x[12] & 0x80;
          if (pump_forced) {
            id(akeron_forced_pump).publish_state(true);
          } else {
            id(akeron_forced_pump).publish_state(false);
          }
          // Config HW depuis trame[13] = x[12]
          id(raw_m13) = x[12];
          id(akeron_cfg_flow_switch).publish_state(x[12] & 0x10);
          id(akeron_cfg_capteur_temp).publish_state(x[12] & 0x04);
          id(akeron_cfg_capteur_sel).publish_state(x[12] & 0x08);
          id(akeron_cfg_ph_plus).publish_state(x[12] & 0x02);   // bit 1 : pompe pH+
          id(akeron_cfg_ph_minus).publish_state(x[12] & 0x01);  // bit 0 : pompe pH-

          // eRegulateur: nibble bas de x[11] (= trame[12] bits 0-3)
          char model_str[32];
          switch (x[11] & 0x0F) {
            case 0: id(akeron_model).publish_state("Regul 4Rx"); break;
            case 1: id(akeron_model).publish_state("Regul"); break;
            case 2: id(akeron_model).publish_state("Regul 3"); break;
            case 3: id(akeron_model).publish_state("Duo"); break;
            case 4: id(akeron_model).publish_state("Duo Regul 3"); break;
            case 5: id(akeron_model).publish_state("Duo Regul 4Rx"); break;
            case 6: id(akeron_model).publish_state("Akeron"); break;
            case 7: id(akeron_model).publish_state("Duo Regul 4Amp"); break;
            default:
              snprintf(model_str, sizeof(model_str), "Unknown (%d)", x[11] & 0x0F);
              id(akeron_model).publish_state(model_str);
          }
        }
        // Trame S
        else if (x[0] == 83) {
          ESP_LOGD("akeron_data", "Akeron Frame S");

          float ph_setpoint = ( ( x[1] * 256 ) +  x[2] ) / 100.0;
          if (ph_setpoint > 3 && ph_setpoint < 11) {
            id(akeron_ph_setpoint).publish_state(ph_setpoint);

            if ( id(akeron_ph_setpoint_number).state != ph_setpoint){
              // publish_state (et non make_call().perform()) : affiche la valeur lue sans la réécrire dans l'Akeron
              id(akeron_ph_setpoint_number).publish_state(ph_setpoint);
            }
          }
          else {
            id(akeron_ph_setpoint).publish_state(NAN);
          }

          // seuil erreur pH Max - trame[10..11] -> x[9..10]
          float ph_threshold_max = ((x[9] * 256) + x[10]) / 100.0f;
          if (ph_threshold_max >= 5.5f && ph_threshold_max <= 9.5f) {
            id(akeron_ph_threshold_max).publish_state(ph_threshold_max);
          }

          // seuil erreur pH Min - trame[12..13] -> x[11..12]
          float ph_threshold_min = ((x[11] * 256) + x[12]) / 100.0f;
          if (ph_threshold_min >= 5.5f && ph_threshold_min <= 9.5f) {
            id(akeron_ph_threshold_min).publish_state(ph_threshold_min);
          }
        }
        //Trame E 69
        else if (x[0] == 69) {
          ESP_LOGD("akeron_data", "Akeron Frame E");

          float redox_setpoint = ( x[1] * 256 ) +  x[2] ;
          id(akeron_redox_setpoint).publish_state(redox_setpoint);
          
          if ( id(akeron_redox_setpoint_number).state != redox_setpoint){
            // publish_state (et non make_call().perform()) : affiche la valeur lue sans la réécrire dans l'Akeron
            id(akeron_redox_setpoint_number).publish_state(redox_setpoint);
          }
        }
        // Trame A
        else if (x[0] == 65) {
          ESP_LOGD("akeron_data", "Akeron Frame A");

          char flow_switch = x[9] & 0x04;
          if (flow_switch) {
          id(akeron_flow_switch_active).publish_state(true);
          }
          else {
          id(akeron_flow_switch_active).publish_state(false);
          }

          char alarm_elx = x[11] & 0xF;
          id(akeron_elx_alarm).publish_state(alarm_elx);

          char alarm_elx_text[256];
          switch(alarm_elx) {
            case 0:
              id(akeron_alarm_elx_text).publish_state("No Alarm");
            break;
            case 1:
              id(akeron_alarm_elx_text).publish_state("Alarm 1: Defaut Electrode en court-circuit ou entartée");
            break;
            case 2:
              id(akeron_alarm_elx_text).publish_state("Alarm 2: Defaut Salinite ou de temperature eau");
            break;
            case 3:
              id(akeron_alarm_elx_text).publish_state("Alarm 3: Defaut Electrode usée ou mal connectée");
            break;
            case 4:
              id(akeron_alarm_elx_text).publish_state("Alarm 4: Defaut Electrique court-circuit de l'appareil");
            break;
            case 7:
              // [corr. 2] l'appli affiche l'icône flow switch pour A7
              id(akeron_alarm_elx_text).publish_state("Alarm 7: Pas de débit (flow switch)");
            break;
            default:
              sprintf(alarm_elx_text,"Unknown Alarm Elx %d", alarm_elx);
              id(akeron_alarm_elx_text).publish_state(alarm_elx_text);
            break;
          }

          id(akeron_elx).publish_state(x[1]);

          if ( id(akeron_elx_setpoint_number).state != x[1]){
            // publish_state (et non make_call().perform()) : affiche la valeur lue sans la réécrire dans l'Akeron
            id(akeron_elx_setpoint_number).publish_state(x[1]);
          }

          // A CONFIRMER !!!
          float boost_time = ( ( x[2] * 256 ) +  x[3] );
          id(akeron_boost_time).publish_state(boost_time);
          if (boost_time > 0) {
            id(akeron_boost).publish_state(true);
          }
          else {
            id(akeron_boost).publish_state(false);
          }

          // Volet
          id(akeron_raw_a10) = x[9];
          id(akeron_cover_production).publish_state((float)x[8]);
          id(akeron_cover_active).publish_state((bool)((x[9] >> 4) & 1));
          id(akeron_cover_force).publish_state((bool)((x[9] >> 3) & 1));

          // Salinité : trame[10] bits 1:0 -> x[9] bits 1:0
          uint8_t sal = x[9] & 0x03;
          if (sal <= 2) {
            if (id(akeron_salinite_select).active_index().value_or(99) != (size_t)sal) {
              // publish_state (et non make_call().perform()) : affiche la valeur lue sans la réécrire dans l'Akeron
              id(akeron_salinite_select).publish_state((size_t)sal);
            }
          }
        }
      }
      return 0;

